name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and test on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show the Swift toolchain and architecture
        run: |
          swift --version
          test "$(uname -m)" = "arm64"

      - name: Build the macOS application target
        run: |
          set -o pipefail
          if ! swift build --product ScribApp --jobs 1 -Xswiftc -disable-batch-mode -v 2>&1 | tee swift-build.log; then
            grep -E '(^|: )error:' swift-build.log | tail -20 | while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              echo "::error::$escaped"
            done
            diagnostic="$(tail -120 swift-build.log | tr '\n' '|' | cut -c1-60000)"
            diagnostic="${diagnostic//'%'/'%25'}"
            echo "::error title=Swift compiler diagnostic::$diagnostic"
            crash_context="$(grep -E 'Stack dump:|Program arguments:|While evaluating request|While type-checking' swift-build.log | tail -12 | tr '\n' '|' | cut -c1-60000 || true)"
            crash_context="${crash_context//'%'/'%25'}"
            echo "::error title=Swift crash context::$crash_context"
            linker_context="$(grep -E 'Undefined symbols|referenced from:|symbol\\(s\\) not found|(^| )ld:|clang: error|error: link' swift-build.log | tail -40 | tr '\n' '|' | cut -c1-60000 || true)"
            linker_context="${linker_context//'%'/'%25'}"
            echo "::error title=Linker diagnostic::$linker_context"
            exit 1
          fi

      - name: Run all tests
        run: swift test --jobs 1 -Xswiftc -disable-batch-mode

      - name: Package the ad hoc signed alpha
        run: bash Scripts/Package-MacApp.sh release artifacts Scrib-0.1.0-alpha.8-macOS

      - name: Upload the alpha archive
        uses: actions/upload-artifact@v4
        with:
          name: Scrib-0.1.0-alpha.8-macOS
          path: |
            artifacts/Scrib-0.1.0-alpha.8-macOS.zip
            artifacts/Scrib-0.1.0-alpha.8-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish the alpha.8 release
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'Release Scrib 0.1.0-alpha.8')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-alpha.8 \
            artifacts/Scrib-0.1.0-alpha.8-macOS.zip \
            artifacts/Scrib-0.1.0-alpha.8-macOS.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Scrib 0.1.0-alpha.8" \
            --notes-file docs/RELEASE_NOTES_0.1.0_ALPHA.8.md \
            --prerelease

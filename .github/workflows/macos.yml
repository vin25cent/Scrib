name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test on Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Show the Swift toolchain
        run: swift --version

      - name: Build the macOS application target
        run: swift build --product ScribApp

      - name: Run all tests
        run: swift test

      - name: Package the unsigned application
        run: bash Scripts/Package-MacApp.sh release artifacts

      - name: Upload the unsigned application
        uses: actions/upload-artifact@v4
        with:
          name: Scrib-macOS-unsigned
          path: |
            artifacts/Scrib-unsigned.zip
            artifacts/Scrib-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 14

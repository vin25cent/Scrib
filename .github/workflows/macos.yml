name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show the Swift toolchain and architecture
        run: |
          swift --version
          test "$(uname -m)" = "arm64"

      - name: Build the macOS application target
        run: |
          set -o pipefail
          if ! swift build --product ScribApp --jobs 1 -Xswiftc -disable-batch-mode -v 2>&1 | tee swift-build.log; then
            grep -E '(^|: )error:' swift-build.log | tail -20 | while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              echo "::error::$escaped"
            done
            diagnostic="$(tail -120 swift-build.log | tr '\n' '|' | cut -c1-60000)"
            diagnostic="${diagnostic//'%'/'%25'}"
            echo "::error title=Swift compiler diagnostic::$diagnostic"
            crash_context="$(grep -E 'Stack dump:|Program arguments:|While evaluating request|While type-checking' swift-build.log | tail -12 | tr '\n' '|' | cut -c1-60000)"
            crash_context="${crash_context//'%'/'%25'}"
            echo "::error title=Swift crash context::$crash_context"
            linker_context="$(grep -E 'Undefined symbols|referenced from:|symbol\\(s\\) not found|(^| )ld:|clang: error|error: link' swift-build.log | tail -40 | tr '\n' '|' | cut -c1-60000)"
            linker_context="${linker_context//'%'/'%25'}"
            echo "::error title=Linker diagnostic::$linker_context"
            exit 1
          fi

      - name: Run all tests
        run: swift test --jobs 1 -Xswiftc -disable-batch-mode

      - name: Package the unsigned application
        run: bash Scripts/Package-MacApp.sh release artifacts

      - name: Upload the unsigned application
        uses: actions/upload-artifact@v4
        with:
          name: Scrib-macOS-unsigned
          path: |
            artifacts/Scrib-unsigned.zip
            artifacts/Scrib-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 14
